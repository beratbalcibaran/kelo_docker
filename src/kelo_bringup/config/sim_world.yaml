room: {width: 8.0, height: 6.0, wall_height: 2.0}

start: {x: 1.0, y: 1.0, yaw: 0.0}

obstacles:
  - {type: box, name: box_a, xy: [2.0, 1.5, 3.0, 2.5], z: [0.0, 1.0]}
  - {type: box, name: box_b, xy: [5.0, 3.0, 6.0, 4.5], z: [0.0, 1.0]}
  - {type: box, name: partition_1, xy: [3.475, 0.0, 3.525, 1.2], z: [0.0, 2.0]}
  - {type: box, name: partition_2, xy: [6.475, 4.8, 6.525, 6.0], z: [0.0, 2.0]}
  - {type: table, name: table, xy: [0.6, 4.4, 1.8, 5.4], top: [0.70, 0.75], leg_r: 0.025}

robot:
  height: 0.70
  max_accel: 1.0
  max_ang_accel: 2.5
  cmd_timeout_s: 0.5

odometry:
  model: faulty
  yaw_k: {wz: [0.6, 1.5], k: [5.3, 8.6]}
  linear_error: {v: [0.06, 0.15], e: [-0.006, -0.018]}

lidar: {beams: 683, rate_hz: 10.0, range_max: 5.6, noise_m: 0.01}

camera: {width: 106, height: 60, hfov_deg: 87.0, vfov_deg: 58.0, rate_hz: 15.0,
         min_depth: 0.28, max_depth: 6.0, noise_k: 0.004}

marvelmind:
  rate_hz: 8.0
  noise_m: 0.02
  outlier_prob: 0.01
  outlier_m: 1.0
  dropout_per_min: 1.0
  dropout_s: [2.0, 6.0]
  offset: [0.0, 0.0]
