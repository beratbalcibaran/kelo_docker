map_server:
  ros__parameters:
    yaml_filename: ""

amcl:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    robot_model_type: "nav2_amcl::OmniMotionModel"
    laser_model_type: "likelihood_field"
    laser_min_range: 0.06
    laser_max_range: 5.5
    max_beams: 90
    min_particles: 400
    max_particles: 2500
    update_min_d: 0.10
    update_min_a: 0.10
    resample_interval: 1
    alpha1: 0.40
    alpha2: 0.20
    alpha3: 0.30
    alpha4: 0.20
    alpha5: 0.30
    sigma_hit: 0.2
    z_hit: 0.6
    z_rand: 0.4
    z_max: 0.05
    z_short: 0.05
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    tf_broadcast: true
    transform_tolerance: 1.0
    save_pose_rate: 0.5
    set_initial_pose: false
    always_reset_initial_pose: false

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # behavior_trees/: stop and wait 5 s for an obstacle on the path, then plan around it
    default_nav_to_pose_bt_xml: navigate_wait_then_detour.xml
    # IsPersonBlocking (kelo_bt_nodes): wait for a person on the path instead of planning around them
    plugin_lib_names: ["kelo_is_person_blocking_bt_node", "kelo_skip_path_start_bt_node"]
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    odom_topic: /odom
    controller_frequency: 15.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      # passing a person between them and a wall runs at a few cm/s (people speed limit times the
      # collision monitor slowdown): that is progress, not a stuck robot
      required_movement_radius: 0.15
      required_movement_angle: 0.5
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    FollowPath:
      # rotation shim: on a new path (e.g. a detour planned while standing in front of an obstacle)
      # turn in place towards it first, then MPPI drives. open loop: inside the collision monitor
      # slowdown zone the measured turn rate is scaled down, and a closed loop ramps up from it.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.5
      angular_disengage_threshold: 0.2
      forward_sampling_distance: 0.6
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.5
      simulate_ahead_time: 1.0
      # at the goal position the shim turns to the goal heading itself: MPPI crept there for minutes
      # when the last turn (under a people speed limit) was only a few degrees out of tolerance
      rotate_to_goal_heading: true
      rotate_to_heading_once: false
      closed_loop: false
      time_steps: 40
      model_dt: 0.07
      batch_size: 1000
      iteration_count: 1
      ax_max: 0.8
      ax_min: -0.8
      ay_max: 0.8
      ay_min: -0.8
      az_max: 1.5
      vx_std: 0.15
      vy_std: 0.05
      wz_std: 0.3
      vx_max: 0.30
      vx_min: -0.05
      vy_max: 0.08
      wz_max: 0.80
      prune_distance: 1.5
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
      GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 1.0}
      GoalAngleCritic: {enabled: true, cost_power: 1, cost_weight: 3.0, threshold_to_consider: 0.5}
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.8
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        {enabled: true, cost_power: 1, cost_weight: 5.0, offset_from_furthest: 5, threshold_to_consider: 1.0}
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 0.5}

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.425, 0.265], [0.425, -0.265], [-0.425, -0.265], [-0.425, 0.265]]"
      plugins: ["obstacle_layer", "camera_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          sensor_frame: laser
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 4.5
          raytrace_max_range: 5.0
          expected_update_rate: 1.5
      camera_layer:
        # 3D voxels: a clearing ray that passes over a low object to the floor behind it must not
        # erase it (a 2D ObstacleLayer does, once the object is in the camera blind zone)
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        origin_z: 0.0
        z_resolution: 0.08
        z_voxels: 16
        unknown_threshold: 16
        mark_threshold: 0
        publish_voxel_map: false
        observation_sources: camera camera_clearing
        camera:
          topic: /camera/points_filtered
          data_type: "PointCloud2"
          sensor_frame: camera_link
          marking: true
          clearing: false
          min_obstacle_height: 0.06
          max_obstacle_height: 1.20
          obstacle_max_range: 2.5
          obstacle_min_range: 0.30
          expected_update_rate: 1.0
          observation_persistence: 0.0
        camera_clearing:
          topic: /camera/points_clearing
          data_type: "PointCloud2"
          sensor_frame: camera_link
          marking: false
          clearing: true
          min_obstacle_height: -1.0
          max_obstacle_height: 1.30
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          expected_update_rate: 1.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.70
      always_send_full_costmap: true
      # read by every StaticLayer from the costmap, not from the layer (Nav2 Jazzy): the static layers
      # (camera layer, people layer) are combined by maximum, unknown cells leave the costmap as it is,
      # and graded values (people layer) are kept instead of being made free or lethal
      use_maximum: true
      trinary_costmap: false

global_costmap:
  global_costmap:
    ros__parameters:
      # the behaviour tree checks the path twice a second and plans right after clearing the costmaps:
      # at 1 Hz a plan could still miss what the sensors had marked again
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      # the inscribed radius (half the body width), not the footprint: the planner (NavFn) plans the
      # centre of the robot against lethal and inscribed cells, and IsPathValid (Nav2 Jazzy) checks the
      # same with a radius, but the footprint at each pose's yaw with a polygon - NavFn leaves every
      # yaw at 0. With the polygon, a detour past a person or around a corner next to a wall looked
      # like a collision, every new path was rejected, and the robot waited for ever on a free path.
      # The body shape is the local costmap's (MPPI) and the collision monitor's.
      robot_radius: 0.265
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "camera_layer", "people_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          sensor_frame: laser
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 4.5
          raytrace_max_range: 5.0
      camera_layer:
        # 3D voxels: a clearing ray that passes over a low object to the floor behind it must not
        # erase it (a 2D ObstacleLayer does, once the object is in the camera blind zone)
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        origin_z: 0.0
        z_resolution: 0.08
        z_voxels: 16
        unknown_threshold: 16
        mark_threshold: 0
        publish_voxel_map: false
        observation_sources: camera camera_clearing
        camera:
          topic: /camera/points_filtered
          data_type: "PointCloud2"
          sensor_frame: camera_link
          marking: true
          clearing: false
          min_obstacle_height: 0.06
          max_obstacle_height: 1.20
          obstacle_max_range: 2.5
          obstacle_min_range: 0.30
          expected_update_rate: 1.0
          observation_persistence: 0.0
        camera_clearing:
          topic: /camera/points_clearing
          data_type: "PointCloud2"
          sensor_frame: camera_link
          marking: false
          clearing: true
          min_obstacle_height: -1.0
          max_obstacle_height: 1.30
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          expected_update_rate: 1.0
          observation_persistence: 0.0
      people_layer:
        # personal space and predicted walking path of the people (social node): only adds cost.
        # Global costmap only: the planner passes people wide. In the local costmap the graded costs
        # around a person slowed MPPI to a crawl on a path past them; there the LiDAR and camera
        # layers have the person, and the social node limits the speed.
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /kelo/people_map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # slower fall-off than the local costmap: with 10 a path 0.5 m from a wall cost almost nothing,
        # and there the rotation stop zone (0.59 m) touches the wall: the robot could neither turn nor
        # leave. 5: 0.5 m from a wall costs 82/252, paths keep off walls without leaving a straight
        # lane; a 0.9 m door (0.45 m to each side) stays passable.
        cost_scaling_factor: 5.0
        inflation_radius: 0.70
      always_send_full_costmap: true
      # read by every StaticLayer from the costmap, not from the layer (Nav2 Jazzy): the static layers
      # (camera layer, people layer) are combined by maximum, unknown cells leave the costmap as it is,
      # and graded values (people layer) are kept instead of being made free or lethal
      use_maximum: true
      trinary_costmap: false

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 500

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.30, 0.30, 0.80]
    min_velocity: [-0.30, -0.30, -0.80]
    max_accel: [0.8, 0.8, 1.5]
    max_decel: [-0.8, -0.8, -1.5]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_safe"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach", "SlowdownZone", "StopZone"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      points: "[[0.425, 0.265], [0.425, -0.265], [-0.425, -0.265], [-0.425, 0.265]]"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 3
      visualize: true
      enabled: true
    SlowdownZone:
      type: "polygon"
      action_type: "slowdown"
      points: "[[1.025, 0.415], [1.025, -0.415], [-0.575, -0.415], [-0.575, 0.415]]"
      slowdown_ratio: 0.4
      min_points: 3
      visualize: true
      polygon_pub_topic: "slowdown_zone"
      enabled: true
    StopZone:
      type: "velocity_polygon"
      action_type: "stop"
      holonomic: true
      min_points: 3
      visualize: true
      polygon_pub_topic: "stop_zone"
      enabled: true
      velocity_polygons: ["rotation", "forward", "left", "right", "backward", "fallback"]
      rotation:
        points: "[[0.55, 0.228], [0.228, 0.55], [-0.228, 0.55], [-0.55, 0.228], [-0.55, -0.228], [-0.228, -0.55], [0.228, -0.55], [0.55, -0.228]]"
        linear_min: 0.0
        linear_max: 0.05
        theta_min: -10.0
        theta_max: 10.0
        direction_start_angle: -3.1416
        direction_end_angle: 3.1416
      forward:
        points: "[[0.76, 0.315], [0.76, -0.315], [-0.475, -0.315], [-0.475, 0.315]]"
        linear_min: 0.05
        linear_max: 10.0
        theta_min: -10.0
        theta_max: 10.0
        direction_start_angle: -0.7854
        direction_end_angle: 0.7854
      left:
        points: "[[0.475, 0.465], [0.475, -0.315], [-0.475, -0.315], [-0.475, 0.465]]"
        linear_min: 0.05
        linear_max: 10.0
        theta_min: -10.0
        theta_max: 10.0
        direction_start_angle: 0.7854
        direction_end_angle: 2.3562
      right:
        points: "[[0.475, 0.315], [0.475, -0.465], [-0.475, -0.465], [-0.475, 0.315]]"
        linear_min: 0.05
        linear_max: 10.0
        theta_min: -10.0
        theta_max: 10.0
        direction_start_angle: -2.3562
        direction_end_angle: -0.7854
      backward:
        points: "[[0.475, 0.315], [0.475, -0.315], [-0.625, -0.315], [-0.625, 0.315]]"
        linear_min: 0.05
        linear_max: 10.0
        theta_min: -10.0
        theta_max: 10.0
        direction_start_angle: 2.3562
        direction_end_angle: -2.3562
      fallback:
        points: "[[0.76, 0.55], [0.76, -0.55], [-0.625, -0.55], [-0.625, 0.55]]"
        linear_min: -10.0
        linear_max: 10.0
        theta_min: -10.0
        theta_max: 10.0
        direction_start_angle: -3.1416
        direction_end_angle: 3.1416
    observation_sources: ["scan", "camera"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
    camera:
      type: "pointcloud"
      topic: "/camera/points_filtered"
      min_height: 0.06
      max_height: 1.20
      use_global_height: false
      enabled: true
