cmd_vel_gate:
  ros__parameters:
    nav_topic: cmd_vel_safe
    teleop_topic: cmd_vel_teleop_safe
    output_topic: /cmd_vel
    stop_topic: /kelo/safety_stop
    state_topic: /kelo/gate_state
    base_frame: base_link
    publish_rate_hz: 20.0
    command_timeout_s: 0.5
    stop_timeout_s: 1.0
    max_vx: 0.30
    max_vy: 0.30
    max_wz: 0.80
    publish_zero_when_idle: true
    # panel button "Obstacle stop": while off, manual driving skips the collision monitor at these
    # lower limits. Navigation keeps its collision monitor. The panel repeats the message every second.
    teleop_raw_topic: /cmd_vel_teleop
    stop_off_topic: /kelo/obstacle_stop_off
    stop_off_timeout_s: 2.0
    stop_off_max_vx: 0.15
    stop_off_max_vy: 0.15
    stop_off_max_wz: 0.50

collision_monitor_teleop:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_teleop
    cmd_vel_out_topic: cmd_vel_teleop_safe
    state_topic: collision_monitor_teleop_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach", "SlowdownZone", "StopZone"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      points: "[[0.425, 0.265], [0.425, -0.265], [-0.425, -0.265], [-0.425, 0.265]]"
      time_before_collision: 1.0
      simulation_time_step: 0.1
      min_points: 3
      visualize: true
      enabled: true
    SlowdownZone:
      type: "polygon"
      action_type: "slowdown"
      points: "[[1.025, 0.415], [1.025, -0.415], [-0.575, -0.415], [-0.575, 0.415]]"
      slowdown_ratio: 0.6
      min_points: 3
      visualize: true
      polygon_pub_topic: "teleop_slowdown_zone"
      enabled: true
    StopZone:
      type: "velocity_polygon"
      action_type: "stop"
      holonomic: true
      min_points: 3
      visualize: true
      polygon_pub_topic: "teleop_stop_zone"
      enabled: true
      velocity_polygons: ["rotation", "forward", "left", "right", "backward", "fallback"]
      rotation:
        points: "[[0.55, 0.228], [0.228, 0.55], [-0.228, 0.55], [-0.55, 0.228], [-0.55, -0.228], [-0.228, -0.55], [0.228, -0.55], [0.55, -0.228]]"
        linear_min: 0.0
        linear_max: 0.05
        theta_min: -10.0
        theta_max: 10.0
        direction_start_angle: -3.1416
        direction_end_angle: 3.1416
      forward:
        points: "[[0.76, 0.315], [0.76, -0.315], [-0.475, -0.315], [-0.475, 0.315]]"
        linear_min: 0.05
        linear_max: 10.0
        theta_min: -10.0
        theta_max: 10.0
        direction_start_angle: -0.7854
        direction_end_angle: 0.7854
      left:
        points: "[[0.475, 0.465], [0.475, -0.315], [-0.475, -0.315], [-0.475, 0.465]]"
        linear_min: 0.05
        linear_max: 10.0
        theta_min: -10.0
        theta_max: 10.0
        direction_start_angle: 0.7854
        direction_end_angle: 2.3562
      right:
        points: "[[0.475, 0.315], [0.475, -0.465], [-0.475, -0.465], [-0.475, 0.315]]"
        linear_min: 0.05
        linear_max: 10.0
        theta_min: -10.0
        theta_max: 10.0
        direction_start_angle: -2.3562
        direction_end_angle: -0.7854
      backward:
        points: "[[0.475, 0.315], [0.475, -0.315], [-0.625, -0.315], [-0.625, 0.315]]"
        linear_min: 0.05
        linear_max: 10.0
        theta_min: -10.0
        theta_max: 10.0
        direction_start_angle: 2.3562
        direction_end_angle: -2.3562
      fallback:
        points: "[[0.76, 0.55], [0.76, -0.55], [-0.625, -0.55], [-0.625, 0.55]]"
        linear_min: -10.0
        linear_max: 10.0
        theta_min: -10.0
        theta_max: 10.0
        direction_start_angle: -3.1416
        direction_end_angle: 3.1416
    observation_sources: ["scan", "camera"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
    camera:
      type: "pointcloud"
      topic: "/camera/points_safety"
      min_height: 0.06
      max_height: 1.20
      use_global_height: false
      enabled: true

cloud_filter:
  ros__parameters:
    target_width: 106
    min_range: 0.30
    # 2.0 m (was 2.5): far floor pixels are the noisiest and most sensitive to a wrong tilt
    max_range: 2.0
    # safety cloud for the collision monitors (/camera/points_safety): no noise filter, as before
    safety_max_range: 2.5
    min_height: 0.06
    max_height: 1.20
    # noise filter (depth_noise.py): without it single pixels and a slightly wrong camera pitch left
    # small squares in the costmaps that could close the path
    denoise: true
    denoise_min_neighbors: 3
    min_height_slope: 0.03          # limit 6 cm up to 1 m, 9 cm at 2 m
    min_height_slope_start: 1.0
    cell_size: 0.05
    cell_min_points: 3
    persistence_frames: 3           # a cell must be seen in 2 of the last 3 frames (odom frame)
    persistence_min: 2
    # camera pitch/roll measured on the floor while the robot stands still, at every start
    auto_tilt: true
    tilt_file: /data/camera_tilt.yaml
    tilt_max_deg: 6.0
    # the camera's lower blind wedge (under the image, close to the robot) is cleared above the LiDAR
    # plane where the scan sees that the way is free; front_x: robot front + 2.5 cm
    blind_clearing: true
    front_x: 0.45

mm_monitor:
  ros__parameters:
    pose_topic: /marvelmind/pose
    map_frame: map
    hedgehog_frame: hedgehog_link
    mm_frame: marvelmind_map
    window: 15
    min_samples: 5
    warn_distance_m: 0.50
    warn_time_s: 3.0
    stop_distance_m: 1.00
    stop_time_s: 2.0
    clear_time_s: 3.0
    mm_timeout_s: 2.0
    stop_enabled: true
    auto_initial_pose: true
    initial_pose_xy_var: 0.25
    initial_pose_yaw_var: 10.0
    initial_pose_retry_s: 5.0
    initial_pose_max_tries: 12

kelo_status:
  ros__parameters:
    scan_topic: /scan
    odom_topic: /odom
    camera_info_topic: /camera/camera/depth/camera_info
    marvelmind_topic: /marvelmind/pose
    max_age_scan_s: 0.5
    max_age_odom_s: 0.5
    max_age_camera_s: 2.0
    max_age_marvelmind_s: 2.0
    summary_period_s: 10.0
